<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DeeMarine Maritime Intelligence</title>
  <style>
    html,body{margin:0;min-height:100%;background:#061a33;color:#eaf4fb;font-family:Inter,Segoe UI,Arial,sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .card{max-width:520px;padding:28px;border:1px solid #2a70ac;border-radius:16px;background:#0b2b56;box-shadow:0 20px 50px rgba(0,0,0,.25)}
    .small{color:#9fc5df;font-size:13px;margin-top:8px}
  </style>
</head>
<body>
  <div class="loading"><div class="card"><strong>Loading DeeMarine Maritime Intelligence…</strong><div class="small">Weekly maritime developments transformed into decision intelligence.</div></div></div>
  <script>
    (async()=> {
      try {
        const urls = Array.from({length:25},(_,i)=>'/maritime-intelligence/chunk-'+String(i+1).padStart(3,'0')+'.txt');
        const parts = await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok) throw new Error(u+' '+r.status); return r.text();})));
        const html = parts.join('\n');
        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        document.body.innerHTML='<div class="loading"><div class="card"><strong>Maritime Intelligence could not load.</strong><div class="small">'+String(e)+'</div></div></div>';
      }
    })();
  </script>
</body>
</html>
