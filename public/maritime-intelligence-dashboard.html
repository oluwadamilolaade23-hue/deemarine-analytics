<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeeMarine Maritime Intelligence — Edition 4</title><style>body{margin:0;background:#06121e;color:#eaf4fb;font:16px Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px;box-sizing:border-box}</style></head>
<body><div class="loading" id="loading">Loading DeeMarine Maritime Intelligence — Edition 4…</div>
<script>
(async function(){
 try {
  const paths = [1,2,3,4,5].map(n=>'/intelligence-edition4/part-'+n+'.txt');
  const responses = await Promise.all(paths.map(p=>fetch(p,{cache:'no-cache'})));
  for(const response of responses){if(!response.ok)throw new Error('Unable to load intelligence data ('+response.status+')');}
  const parts = await Promise.all(responses.map(r=>r.text()));
  const html = parts.join('\n');
  if(!html.trimStart().startsWith('<!DOCTYPE html>') || !html.trimEnd().endsWith('</html>'))throw new Error('Incomplete Edition 4 source');
  document.open();document.write(html);document.close();
 }catch(err){document.getElementById('loading').textContent='The maritime intelligence dashboard could not be loaded. Please refresh the page. '+err.message;console.error(err);}
})();
</script></body></html>
